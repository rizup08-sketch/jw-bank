        // --- 보안: 순수 JS SHA-256 해시 함수 (평문 PIN 노출 방지, 모든 브라우저/프로토콜 지원) ---
        function sha256(ascii) {
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            const mathPow = Math.pow;
            const maxWord = mathPow(2, 32);
            const lengthProperty = 'length';
            let i, j;
            let result = '';
            const words = [];
            const asciiBitLength = ascii[lengthProperty] * 8;
            let hash = sha256.h = sha256.h || [];
            const k = sha256.k = sha256.k || [];
            let primeCounter = k[lengthProperty];
            const isComposite = {};
            for (let candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                }
            }
            ascii += '\x80';
            while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii[lengthProperty]; i++) {
                j = ascii.charCodeAt(i);
                if (j >> 8) return '';
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                const w = words.slice(j, j += 16);
                const oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    const i2 = i + j;
                    const w15 = w[i - 15], w2 = w[i - 2];
                    const a = hash[0], e = hash[4];
                    const temp1 = hash[7]
                        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6]))
                        + k[i]
                        + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16]
                            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                            + w[i - 7]
                            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                        ) | 0);
                    const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    const b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }

        // 기본 PIN 해시값 (평문 노출 없음)
        const DEFAULT_PIN_HASH = "15d700ad21280a8c2fa03075c55c70a766ea8c9db5b5d8f7a850835e67514357";

        // 기본 자주 쓰는 메모 프리셋
        const DEFAULT_WITHDRAW_MEMOS = ['간식/군것질', '편의점', '문구/학용품', '장난감/취미', '다이소', '선물', '게임/콘텐츠', '도서/책', '현금인출'];
        const DEFAULT_DEPOSIT_MEMOS = ['용돈', '심부름/칭찬', '세뱃돈/명절', '생일축하금', '상금/보너스', '저금통 입금', '할머니/할아버지'];

        // 기본 앱 설정
        const DEFAULT_CONFIG = {

            interestRate: 1, // %

        // --- 타임존 오차 없는 날짜 파싱 유틸리티 ---
        function parseDateParts(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return { year: 1970, month: 1, day: 1 };
            const parts = dateStr.split('-');
            return {
                year: Number(parts[0]) || 1970,
                month: Number(parts[1]) || 1,
                day: Number(parts[2]) || 1
            };
        }

        function createLocalTimestamp(dateStr) {
            const { year, month, day } = parseDateParts(dateStr);
            const now = new Date();
            const localDate = new Date(year, month - 1, day, now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
            return localDate.getTime();
        }

        // 차트 컬러 팔레트
        const CHART_COLORS_EXPENSE = ['#3182F6', '#64A8FF', '#00C471', '#FFB800', '#9B51E0', '#8B95A1'];
        const CHART_COLORS_INCOME = ['#F04452', '#FF7B86', '#FF9F43', '#9B51E0', '#3182F6', '#8B95A1'];

        // --- 아이콘 컴포넌트 ---
        const IconLock = ({ color = "#8B95A1" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2, ry: 2 }), createElement('path', { d: "M7 11V7a5 5 0 0 1 10 0v4" }));
        const IconUnlock = ({ color = "#3182F6" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2, ry: 2 }), createElement('path', { d: "M7 11V7a5 5 0 0 1 9.9-1" }));
        const IconPlus = () => createElement('svg', { width: 30, height: 30, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 3, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('line', { x1: 12, y1: 5, x2: 12, y2: 19 }), createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 }));
        const IconX = () => createElement('svg', { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('line', { x1: 18, y1: 6, x2: 6, y2: 18 }), createElement('line', { x1: 6, y1: 6, x2: 18, y2: 18 }));
        const IconDownload = () => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className: "mr-2" }, createElement('path', { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }), createElement('polyline', { points: "7 10 12 15 17 10" }), createElement('line', { x1: 12, y1: 15, x2: 12, y2: 3 }));
        const IconSettings = ({ color = "#4E5968" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('circle', { cx: 12, cy: 12, r: 3 }), createElement('path', { d: "M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" }));
        const IconChart = ({ color = "currentColor" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, createElement('line', { x1: 18, y1: 20, x2: 18, y2: 10 }), createElement('line', { x1: 12, y1: 20, x2: 12, y2: 4 }), createElement('line', { x1: 6, y1: 20, x2: 6, y2: 14 }));

        function App() {
            const [user, setUser] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [isLoading, setIsLoading] = useState(true);

            // 앱 설정 상태 (localStorage 초기 로드 + Firestore 실시간 연동)
            const [appConfig, setAppConfig] = useState(() => {
                try {
                    const saved = localStorage.getItem('jwbank_config');
                    if (saved) return { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
                } catch (e) {}
                return DEFAULT_CONFIG;
            });

            const [selectedChild, setSelectedChild] = useState('혜나');
            const [isParent, setIsParent] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState(false);

            // 부모 설정 모달 상태
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [settingAllowance, setSettingAllowance] = useState('');
            const [settingInterestRate, setSettingInterestRate] = useState('');
            const [settingNewPin, setSettingNewPin] = useState('');
            const [settingChildren, setSettingChildren] = useState(['혜나', '진서']);
            const [newChildName, setNewChildName] = useState('');

            // 내역 추가 및 수정 폼 상태
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingTxId, setEditingTxId] = useState(null);
            const [formType, setFormType] = useState('withdraw');
            const [formAmount, setFormAmount] = useState('');
            const [formDate, setFormDate] = useState('');
            const [formMemo, setFormMemo] = useState('');
            const [isEditingMemos, setIsEditingMemos] = useState(false);
            const [newPresetMemo, setNewPresetMemo] = useState('');

            // 통계 차트 상태
            const [showChartSection, setShowChartSection] = useState(true);
            const [chartTab, setChartTab] = useState('monthly'); // 'monthly' | 'category' | 'balance'
            const [categoryChartType, setCategoryChartType] = useState('withdraw'); // 'withdraw' | 'deposit'
            const [selectedBarMonth, setSelectedBarMonth] = useState(null);

            // 롱프레스(수정/순서변경) 액션 메뉴 상태
            const [actionTx, setActionTx] = useState(null);
            const pressTimer = useRef(null);

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const localDateStr = `${yyyy}-${mm}-${dd}`;
            const localYearMonth = `${yyyy}-${mm}`;

            const [selectedYear, setSelectedYear] = useState(yyyy);
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth() + 1);

            const [showClaimModal, setShowClaimModal] = useState(false);
            const [claimStep, setClaimStep] = useState(0);
            const [calculatedInterest, setCalculatedInterest] = useState(0);
            const [isClaiming, setIsClaiming] = useState(false);

            const isBeforeApril2026 = yyyy < 2026 || (yyyy === 2026 && now.getMonth() < 3);

            // 설정 저장 헬퍼 (localStorage + Firestore 동시 반영)
            const saveAppConfig = async (newConfig) => {
                const merged = { ...appConfig, ...newConfig };
                setAppConfig(merged);
                try {
                    localStorage.setItem('jwbank_config', JSON.stringify(merged));
                } catch (e) {}
                if (user) {
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jwbank_settings', 'config'), merged, { merge: true });
                    } catch (e) {}
                }
            };

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions');
                const unsubTx = onSnapshot(q, (snapshot) => {
                    setTransactions(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoading(false);
                });

                const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'jwbank_settings', 'config');
                const unsubConfig = onSnapshot(configDocRef, (snap) => {
                    if (snap.exists()) {
                        const remoteConfig = { ...DEFAULT_CONFIG, ...snap.data() };
                        setAppConfig(remoteConfig);
                        try { localStorage.setItem('jwbank_config', JSON.stringify(remoteConfig)); } catch (e) {}
                    }
                }, () => {});

                return () => {
                    unsubTx();
                    unsubConfig();
                };
            }, [user]);

            // 동적 연도 목록 생성 (2023년 ~ 현재 연도 + 거래 내역에 존재하는 모든 연도)
            const availableYears = useMemo(() => {
                const yearSet = new Set([2023, 2024, 2025, 2026, yyyy]);
                for (let y = 2023; y <= yyyy; y++) yearSet.add(y);
                transactions.forEach(t => {
                    if (t.date) {
                        const { year } = parseDateParts(t.date);
                        if (year >= 2000 && year <= 2100) yearSet.add(year);
                    }
                });
                return Array.from(yearSet).sort((a, b) => a - b);
            }, [transactions, yyyy]);

            // 선택된 자녀의 전체 거래 내역 (1차 메모이제이션으로 성능 최적화)
            const childTransactions = useMemo(() => {
                return transactions.filter(t => t.child === selectedChild);
            }, [transactions, selectedChild]);

            const hasClaimedThisMonth = useMemo(() => {
                return childTransactions.some(t =>
                    t.date && t.date.startsWith(localYearMonth) &&
                    t.memo && t.memo.includes('[자동]')
                );
            }, [childTransactions, localYearMonth]);

            const totalBalance = useMemo(() => {
                return childTransactions.reduce((acc, t) => t.type === 'deposit' ? acc + t.amount : acc - t.amount, 0);
            }, [childTransactions]);

            // 필터링 및 정렬된 데이터 (타임존 오차 없는 문자열 파싱 적용)
            const filtered = useMemo(() => {
                return childTransactions
                    .filter(t => {
                        const { year, month } = parseDateParts(t.date);
                        const yMatch = year === selectedYear;
                        const mMatch = selectedMonth === 0 || month === selectedMonth;
                        return yMatch && mMatch;
                    })
                    .sort((a, b) => b.timestamp - a.timestamp);
            }, [childTransactions, selectedYear, selectedMonth]);

            const { allTimeIncome, allTimeExpense } = useMemo(() => {
                return childTransactions.reduce((acc, t) => {
                    if (t.type === 'deposit') acc.allTimeIncome += t.amount;
                    else acc.allTimeExpense += t.amount;
                    return acc;
                }, { allTimeIncome: 0, allTimeExpense: 0 });
            }, [childTransactions]);

            const { periodIncome, periodExpense } = useMemo(() => {
                return filtered.reduce((acc, t) => {
                    if (t.type === 'deposit') acc.periodIncome += t.amount;
                    else acc.periodExpense += t.amount;
                    return acc;
                }, { periodIncome: 0, periodExpense: 0 });
            }, [filtered]);

            // --- 자주 사용하는 메모 추천 목록 (기본/커스텀 프리셋 + 최근 자주 쓴 내역 자동 결합) ---
            const currentMemoPresets = useMemo(() => {
                const baseList = formType === 'withdraw'
                    ? (appConfig.withdrawMemos || DEFAULT_WITHDRAW_MEMOS)
                    : (appConfig.depositMemos || DEFAULT_DEPOSIT_MEMOS);

                // 기존 거래 내역에서 해당 유형(입금/출금)으로 자주 입력했던 메모 추출
                const freqMap = {};
                childTransactions.forEach(t => {
                    if (t.type === formType && t.memo && !t.memo.includes('[자동]')) {
                        const cleanMemo = t.memo.trim();
                        if (cleanMemo && !baseList.includes(cleanMemo)) {
                            freqMap[cleanMemo] = (freqMap[cleanMemo] || 0) + 1;
                        }
                    }
                });
                const recentFrequent = Object.entries(freqMap)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 4)
                    .map(([memo]) => memo);

                return { baseList, recentFrequent };
            }, [formType, appConfig.withdrawMemos, appConfig.depositMemos, childTransactions]);

            const handleAddPresetMemo = () => {
                const trimmed = (newPresetMemo || formMemo || '').trim();
                if (!trimmed) return alert('추가할 자주 쓰는 메모 내용을 입력해주세요.');
                if (formType === 'withdraw') {
                    const list = appConfig.withdrawMemos || DEFAULT_WITHDRAW_MEMOS;
                    if (!list.includes(trimmed)) saveAppConfig({ withdrawMemos: [...list, trimmed] });
                } else {
                    const list = appConfig.depositMemos || DEFAULT_DEPOSIT_MEMOS;
                    if (!list.includes(trimmed)) saveAppConfig({ depositMemos: [...list, trimmed] });
                }
                setFormMemo(trimmed);
                setNewPresetMemo('');
            };

            const handleRemovePresetMemo = (memoToRemove) => {
                if (formType === 'withdraw') {
                    const list = (appConfig.withdrawMemos || DEFAULT_WITHDRAW_MEMOS).filter(m => m !== memoToRemove);
                    saveAppConfig({ withdrawMemos: list });
                } else {
                    const list = (appConfig.depositMemos || DEFAULT_DEPOSIT_MEMOS).filter(m => m !== memoToRemove);
                    saveAppConfig({ depositMemos: list });
                }
            };

            // --- 통계 차트용 데이터 계산 ---
            // 1. 선택 연도 월별(1~12월) 수입/지출 및 누적 잔액 추이
            const monthlyStats = useMemo(() => {
                const months = Array.from({ length: 12 }, (_, i) => ({
                    month: i + 1,
                    income: 0,
                    expense: 0,
                    net: 0,
                    endBalance: 0
                }));

                // 선택 연도 이전까지의 기초 잔액 계산
                let runningBalance = 0;
                const sortedAll = [...childTransactions].sort((a, b) => a.timestamp - b.timestamp);

                sortedAll.forEach(t => {
                    const { year, month } = parseDateParts(t.date);
                    const delta = t.type === 'deposit' ? t.amount : -t.amount;
                    if (year < selectedYear) {
                        runningBalance += delta;

                    groupMap[label] = (groupMap[label] || 0) + t.amount;

                const sorted = Object.entries(groupMap)

                    return {

                                ),

                                // 날짜 선택
                                createElement('div', null,
                                    createElement('label', { className: "text-xs font-bold text-[#8B95A1] ml-1" }, "날짜"),
                                    createElement('input', {
                                        type: "date",
                                        className: "w-full bg-[#F2F4F6] p-4 rounded-xl font-bold outline-none mt-1",
                                        value: formDate,
                                        onChange: e => setFormDate(e.target.value)
                                    })
                                ),

                                // 메모 입력 및 자주 사용하는 내용 화면 선택 (칩 UI)
                                createElement('div', { className: "space-y-2.5" },
                                    createElement('div', { className: "flex justify-between items-center" },
                                        createElement('label', { className: "text-xs font-bold text-[#8B95A1] ml-1" }, "메모 (화면에서 선택하거나 직접 입력)"),
                                        createElement('button', {
                                            type: "button",
                                            onClick: () => setIsEditingMemos(!isEditingMemos),
                                            className: `text-[11px] font-bold px-2.5 py-1 rounded-lg transition ${isEditingMemos ? 'bg-[#3182F6] text-white' : 'bg-[#F2F4F6] text-[#4E5968]'}`
                                        }, isEditingMemos ? "편집 완료" : "⚙️ 문구 편집")
                                    ),

                                    // 자주 쓰는 메모 칩 목록
                                    createElement('div', { className: "bg-[#F9FAFB] p-3.5 rounded-2xl border border-gray-100 space-y-2.5" },
                                        createElement('p', { className: "text-[11px] font-bold text-[#8B95A1]" },
                                            formType === 'withdraw' ? "📌 자주 쓰는 출금 메모" : "📌 자주 쓰는 입금 메모"
                                        ),
                                        createElement('div', { className: "flex flex-wrap gap-2" },
                                            currentMemoPresets.baseList.map(preset => {
                                                const isActive = formMemo === preset;
                                                const activeStyle = formType === 'withdraw'
                                                    ? 'bg-[#3182F6] text-white shadow-sm border-[#3182F6]'
                                                    : 'bg-[#F04452] text-white shadow-sm border-[#F04452]';
                                                return createElement('div', { key: preset, className: "inline-flex items-center" },
                                                    createElement('button', {
                                                        type: "button",
                                                        onClick: () => setFormMemo(isActive ? '' : preset),
                                                        className: `px-3.5 py-2 rounded-xl text-xs font-bold border transition active:scale-95 ${isActive ? activeStyle : 'bg-white text-[#191F28] border-gray-200 hover:border-gray-300'}`
                                                    }, preset),
                                                    isEditingMemos && createElement('button', {
                                                        type: "button",
                                                        onClick: () => handleRemovePresetMemo(preset),
                                                        className: "-ml-1.5 -mt-2 w-5 h-5 rounded-full bg-[#F04452] text-white text-[10px] font-black flex items-center justify-center shadow"
                                                    }, "×")
                                                );
                                            }),

                                            // 최근 직접 입력했던 단골 메모 자동 추천 칩
                                            !isEditingMemos && currentMemoPresets.recentFrequent.map(recent => {
                                                const isActive = formMemo === recent;
                                                const activeStyle = formType === 'withdraw'
                                                    ? 'bg-[#3182F6] text-white shadow-sm border-[#3182F6]'
                                                    : 'bg-[#F04452] text-white shadow-sm border-[#F04452]';
                                                return createElement('button', {
                                                    key: `recent-${recent}`,
                                                    type: "button",
                                                    onClick: () => setFormMemo(isActive ? '' : recent),
                                                    className: `px-3.5 py-2 rounded-xl text-xs font-bold border border-dashed transition active:scale-95 ${isActive ? activeStyle : 'bg-white text-[#4E5968] border-gray-300'}`
                                                }, `🕒 ${recent}`);
                                            })
                                        ),

                                        // 문구 편집 모드일 때 새 자주 쓰는 문구 추가 인풋
                                        isEditingMemos && createElement('div', { className: "flex space-x-2 pt-2 border-t border-gray-200" },
                                            createElement('input', {
                                                type: "text",
                                                placeholder: "새 자주 쓰는 문구 입력 (예: 학원간식)",
                                                className: "flex-1 bg-white px-3 py-2 rounded-xl text-xs font-bold border border-gray-200 outline-none",
                                                value: newPresetMemo,
                                                onChange: e => setNewPresetMemo(e.target.value),
                                                onKeyDown: e => { if (e.key === 'Enter') handleAddPresetMemo(); }
                                            }),
                                            createElement('button', {
                                                type: "button",
                                                onClick: handleAddPresetMemo,
                                                className: "px-3.5 py-2 bg-[#191F28] text-white rounded-xl text-xs font-bold shrink-0"
                                            }, "+ 추가")
                                        )
                                    ),

                                    // 직접 입력 인풋 (선택한 문구 수정 또는 직접 입력)
                                    createElement('div', { className: "relative" },
                                        createElement('input', {
                                            type: "text",
                                            placeholder: "위 버튼을 누르거나 직접 입력하세요",
                                            className: "w-full bg-[#F2F4F6] p-4 pr-10 rounded-xl font-bold outline-none",
                                            value: formMemo,
                                            onChange: e => setFormMemo(e.target.value)
                                        }),
                                        formMemo && createElement('button', {
                                            type: "button",
                                            onClick: () => setFormMemo(''),
                                            className: "absolute right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-gray-300 text-white text-xs font-black flex items-center justify-center"
                                        }, "×")
                                    )
                                )
                            ),
                            createElement('button', {
                                onClick: handleSaveTransaction,
                                className: "w-full bg-[#3182F6] text-white py-5 rounded-2xl font-bold text-lg shadow-md active:scale-[0.99] transition"
                            }, editingTxId ? "수정 완료" : "저장하기")
                        )
                    )
                )
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(createElement(App));
    </script>
</body>
</html>
