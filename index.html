<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JW은행</title>
    <!-- iOS 앱 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="JW은행">
    
    <!-- 아이콘 설정 -->
    <link rel="icon" type="image/png" href="image.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="image.png?v=2">
    <link rel="shortcut icon" href="image.png?v=2">
    
    <!-- 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes pulseFast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-pulse-fast { animation: pulseFast 0.8s infinite; }
    </style>
</head>
<body class="bg-[#F2F4F6]">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBs0ZOssVIy-Fc9z84LLWDf68k8hwxsISo",
            authDomain: "jw-bank-6b35b.firebaseapp.com",
            projectId: "jw-bank-6b35b",
            storageBucket: "jw-bank-6b35b.firebasestorage.app",
            messagingSenderId: "531864978645",
            appId: "1:531864978645:web:01f82a3859a42434294e5c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'jwbank-main';

        const { useState, useEffect, useMemo, createElement } = React;

        // --- 아이콘 컴포넌트 ---
        const IconLock = ({ color = "#8B95A1" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
            createElement('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2, ry: 2 }),
            createElement('path', { d: "M7 11V7a5 5 0 0 1 10 0v4" })
        );
        const IconUnlock = ({ color = "#3182F6" }) => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
            createElement('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2, ry: 2 }),
            createElement('path', { d: "M7 11V7a5 5 0 0 1 9.9-1" })
        );
        const IconPlus = () => createElement('svg', { width: 30, height: 30, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 3, strokeLinecap: "round", strokeLinejoin: "round" },
            createElement('line', { x1: 12, y1: 5, x2: 12, y2: 19 }),
            createElement('line', { x1: 5, y1: 12, x2: 19, y2: 12 })
        );
        const IconX = () => createElement('svg', { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
            createElement('line', { x1: 18, y1: 6, x2: 6, y2: 18 }),
            createElement('line', { x1: 6, y1: 6, x2: 18, y2: 18 })
        );
        const IconDownload = () => createElement('svg', { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className: "mr-2" },
            createElement('path', { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }),
            createElement('polyline', { points: "7 10 12 15 17 10" }),
            createElement('line', { x1: 12, y1: 15, x2: 12, y2: 3 })
        );

        function App() {
            const [user, setUser] = useState(null);
            const [transactions, setTransactions] = useState([]);
            const [isLoading, setIsLoading] = useState(true); // 로딩 상태 추가
            
            const [selectedChild, setSelectedChild] = useState('혜나');
            const [isParent, setIsParent] = useState(false);
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [formType, setFormType] = useState('withdraw');
            const [formAmount, setFormAmount] = useState('');
            const [formDate, setFormDate] = useState('');
            const [formMemo, setFormMemo] = useState('');

            // 현재 날짜 정보 얻기 (오늘 날짜 기본 세팅용)
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const localDateStr = `${yyyy}-${mm}-${dd}`;
            const localYearMonth = `${yyyy}-${mm}`;

            const [selectedYear, setSelectedYear] = useState(yyyy);
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth() + 1);

            // 용돈&이자 애니메이션 상태
            const [showClaimModal, setShowClaimModal] = useState(false);
            const [claimStep, setClaimStep] = useState(0);
            const [calculatedInterest, setCalculatedInterest] = useState(0);
            const [isClaiming, setIsClaiming] = useState(false); // 중복 클릭 방지용

            // 4월부터 시작 제한
            const isBeforeApril2026 = yyyy < 2026 || (yyyy === 2026 && now.getMonth() < 3);

            // 모달 열릴 때 오늘 날짜로 자동 세팅
            useEffect(() => {
                if (showAddModal) {
                    setFormDate(localDateStr);
                    setFormAmount('');
                    setFormMemo('');
                }
            }, [showAddModal, localDateStr]);

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = collection(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions');
                return onSnapshot(q, (snapshot) => {
                    setTransactions(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoading(false); // 데이터 불러오기 완료
                });
            }, [user]);

            // 이번 달 혜택 받았는지 여부
            const hasClaimedThisMonth = useMemo(() => {
                return transactions.some(t => 
                    t.child === selectedChild && 
                    t.date.startsWith(localYearMonth) && 
                    t.memo.includes('[자동]')
                );
            }, [transactions, selectedChild, localYearMonth]);

            const totalBalance = useMemo(() => {
                return transactions.filter(t => t.child === selectedChild).reduce((acc, t) => t.type === 'deposit' ? acc + t.amount : acc - t.amount, 0);
            }, [transactions, selectedChild]);

            const startClaim = () => {
                if (isClaiming || hasClaimedThisMonth) return; // 중복 클릭 막기
                setIsClaiming(true);
                
                const allowance = 20000;
                const newBal = totalBalance + allowance;
                const interestAmount = Math.floor(newBal * 0.01);
                setCalculatedInterest(interestAmount);
                setClaimStep(1);
                setShowClaimModal(true);
            };

            const saveClaimToDB = async () => {
                try {
                    const batch = writeBatch(db);
                    const doc1 = doc(collection(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions'));
                    batch.set(doc1, {
                        child: selectedChild, type: 'deposit', amount: 20000, category: '용돈',
                        date: localDateStr, memo: `[자동] ${now.getMonth() + 1}월 용돈`, timestamp: Date.now()
                    });
                    const doc2 = doc(collection(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions'));
                    batch.set(doc2, {
                        child: selectedChild, type: 'deposit', amount: calculatedInterest, category: '이자',
                        date: localDateStr, memo: `[자동] ${now.getMonth() + 1}월 이자 (1%)`, timestamp: Date.now() + 1
                    });
                    await batch.commit();
                } catch (e) { 
                    console.error(e); 
                    setIsClaiming(false); 
                }
            };

            useEffect(() => {
                if (claimStep === 1) setTimeout(() => setClaimStep(2), 2000);
                else if (claimStep === 2) setTimeout(() => {
                    setClaimStep(3);
                    if (window.confetti) window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, zIndex: 1000 });
                    saveClaimToDB();
                }, 2500);
                else if (claimStep === 3) setTimeout(() => { 
                    setShowClaimModal(false); 
                    setClaimStep(0); 
                    setIsClaiming(false); // 애니메이션 완전히 끝난 후 중복클릭 방지 해제
                }, 3000);
            }, [claimStep]);

            const formatMoney = (v) => new Intl.NumberFormat('ko-KR').format(v) + '원';

            return createElement('div', { className: "min-h-screen flex justify-center bg-[#F2F4F6]" },
                createElement('div', { className: "w-full max-w-md h-screen flex flex-col bg-white overflow-hidden relative shadow-2xl" },
                    createElement('header', { className: "px-6 pt-12 pb-4 flex justify-between items-center border-b border-gray-50 bg-white z-10" },
                        createElement('h1', { className: "text-xl font-black text-[#3182F6]" }, "JW은행"),
                        createElement('button', { onClick: () => isParent ? setIsParent(false) : setShowPinModal(true), className: "p-2 rounded-full bg-gray-50" },
                            isParent ? createElement(IconUnlock, { color: "#3182F6" }) : createElement(IconLock, { color: "#8B95A1" })
                        )
                    ),
                    createElement('div', { className: "flex-1 overflow-y-auto pb-24 bg-[#F2F4F6] hide-scrollbar" },
                        createElement('div', { className: "p-5 space-y-4" },
                            
                            // 로딩이 완전히 끝났고, 이번 달에 안 받았고, 4월 1일 이후일 때만 배너 표시
                            (!isLoading && !hasClaimedThisMonth && !isBeforeApril2026) && createElement('div', { className: "bg-gradient-to-r from-blue-500 to-indigo-500 rounded-[24px] p-5 text-white flex justify-between items-center shadow-lg animate-pop-in" },
                                createElement('div', null,
                                    createElement('p', { className: "text-[12px] font-bold opacity-80 mb-1" }, "매달 1일 정기 혜택"),
                                    createElement('p', { className: "text-[18px] font-black" }, `${now.getMonth() + 1}월 용돈 + 이자 받기 🎁`)
                                ),
                                createElement('button', { onClick: startClaim, disabled: isClaiming, className: "bg-white text-[#3182F6] px-5 py-3 rounded-2xl font-black shadow-sm active:scale-95 transition disabled:opacity-50" }, "받기")
                            ),

                            createElement('div', { className: "bg-white rounded-[28px] p-6 shadow-sm" },
                                createElement('div', { className: "flex space-x-2 mb-6 bg-[#F2F4F6] p-1 rounded-2xl w-fit" },
                                    ['혜나', '진서'].map(c => createElement('button', { 
                                        key: c, onClick: () => setSelectedChild(c),
                                        className: `px-5 py-2 rounded-xl text-sm font-bold transition-all ${selectedChild === c ? 'bg-white shadow-sm text-[#191F28]' : 'text-[#8B95A1]'}`
                                    }, c))
                                ),
                                createElement('p', { className: "text-sm font-medium text-[#8B95A1] mb-1" }, "총 통장 잔액"),
                                createElement('h2', { className: "text-3xl font-black text-[#191F28] mb-6" }, formatMoney(totalBalance))
                            ),
                            
                            createElement('div', { className: "bg-white rounded-[28px] p-6 shadow-sm min-h-[400px]" },
                                createElement('div', { className: "flex justify-between items-center mb-4 border-b border-gray-50 pb-4" },
                                    createElement('h3', { className: "font-bold text-[17px]" }, "상세 내역"),
                                    createElement('div', { className: "flex space-x-1" },
                                        createElement('select', { value: selectedYear, onChange: e => setSelectedYear(Number(e.target.value)), className: "bg-[#F2F4F6] text-xs font-bold p-2 rounded-lg outline-none" }, [2023, 2024, 2025, 2026].map(y => createElement('option', { key: y, value: y }, y + '년'))),
                                        createElement('select', { value: selectedMonth, onChange: e => setSelectedMonth(Number(e.target.value)), className: "bg-[#F2F4F6] text-xs font-bold p-2 rounded-lg outline-none" }, createElement('option', { value: 0 }, "전체"), Array.from({length:12}, (_, i)=>i+1).map(m => createElement('option', { key: m, value: m }, m + '월')))
                                    )
                                ),
                                createElement('div', { className: "space-y-6" },
                                    transactions.filter(t => t.child === selectedChild && (new Date(t.date).getFullYear() === selectedYear) && (selectedMonth === 0 || new Date(t.date).getMonth()+1 === selectedMonth))
                                    .sort((a,b) => b.timestamp - a.timestamp).map(t => createElement('div', { key: t.id, className: "flex justify-between items-center group" },
                                        createElement('div', { className: "flex items-center" },
                                            createElement('div', { className: `w-11 h-11 rounded-full flex items-center justify-center mr-3 font-bold text-[10px] ${t.type === 'deposit' ? 'bg-[#FFF2F3] text-[#F04452]' : 'bg-[#E8F3FF] text-[#3182F6]'}` }, t.type === 'deposit' ? "입금" : "출금"),
                                            createElement('div', null, createElement('p', { className: "text-[15px] font-bold text-[#191F28] mb-0.5" }, t.memo || t.category), createElement('p', { className: "text-[12px] font-medium text-[#8B95A1]" }, t.date.slice(5) + " · " + t.category))
                                        ),
                                        createElement('div', { className: "text-right" },
                                            createElement('p', { className: `text-[16px] font-black ${t.type === 'deposit' ? 'text-[#F04452]' : 'text-[#3182F6]'}` }, (t.type === 'deposit' ? "+" : "-") + formatMoney(t.amount)),
                                            isParent && createElement('button', { onClick: () => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions', t.id)), className: "text-[10px] text-red-300 opacity-0 group-hover:opacity-100 transition" }, "삭제")
                                        )
                                    ))
                                )
                            )
                        )
                    ),
                    showClaimModal && createElement('div', { className: "fixed inset-0 bg-[#191F28]/95 backdrop-blur-md z-[100] flex flex-col items-center justify-center p-6 text-white" },
                        claimStep === 1 && createElement('div', { className: "animate-pop-in flex flex-col items-center text-center" },
                            createElement('div', { className: "text-[80px] mb-6 animate-bounce" }, "💰"),
                            createElement('h2', { className: "text-2xl font-black mb-3" }, `${now.getMonth() + 1}월 용돈 도착!`),
                            createElement('p', { className: "text-3xl font-black text-[#F04452] bg-white px-8 py-4 rounded-3xl shadow-2xl" }, "+20,000원")
                        ),
                        claimStep === 2 && createElement('div', { className: "animate-pop-in flex flex-col items-center text-center" },
                            createElement('div', { className: "text-[80px] mb-6 animate-pulse-fast" }, "📈"),
                            createElement('h2', { className: "text-2xl font-black mb-3" }, "특별 이자 계산 중..."),
                            createElement('p', { className: "text-3xl font-black text-[#F04452] bg-white px-8 py-4 rounded-3xl shadow-2xl" }, `+${formatMoney(calculatedInterest)}`)
                        ),
                        claimStep === 3 && createElement('div', { className: "animate-pop-in flex flex-col items-center text-center" },
                            createElement('div', { className: "text-[80px] mb-6" }, "🎉"),
                            createElement('h2', { className: "text-4xl font-black mb-3" }, "입금 완료!"),
                            createElement('p', { className: "text-xl text-gray-200" }, `총 ${formatMoney(20000 + calculatedInterest)} 추가됨`)
                        )
                    ),
                    
                    // PIN 모달 (숫자 패드 적용)
                    showPinModal && createElement('div', { className: "absolute inset-0 bg-[#191F28]/60 backdrop-blur-sm z-50 flex items-center justify-center p-6" },
                        createElement('div', { className: "bg-white w-full rounded-[32px] p-8" },
                            createElement('input', { 
                                type: "password", 
                                inputMode: "numeric", // 숫자 키패드 띄우기
                                pattern: "[0-9]*", 
                                placeholder: "PIN 입력", 
                                className: "w-full bg-[#F2F4F6] p-5 rounded-2xl text-center text-3xl font-black outline-none", 
                                value: pinInput, 
                                onChange: e => setPinInput(e.target.value.replace(/[^0-9]/g, '')), // 숫자만 입력되게 필터링
                                autoFocus: true 
                            }),
                            createElement('div', { className: "flex space-x-3 mt-6" },
                                createElement('button', { onClick: () => setShowPinModal(false), className: "flex-1 bg-gray-100 text-gray-400 py-4 rounded-2xl font-bold" }, "취소"),
                                createElement('button', { onClick: () => { if(pinInput==='007000'){setIsParent(true);setShowPinModal(false);} setPinInput(''); }, className: "flex-[2] bg-[#3182F6] text-white py-4 rounded-2xl font-bold" }, "확인")
                            )
                        )
                    ),

                    // 추가 모달 (오늘 날짜, 금액 숫자 패드 적용)
                    isParent && createElement('button', { onClick: () => setShowAddModal(true), className: "absolute bottom-8 right-8 w-16 h-16 bg-[#3182F6] text-white rounded-full flex items-center justify-center shadow-xl z-20" },
                        createElement(IconPlus)
                    ),
                    showAddModal && createElement('div', { className: "absolute inset-0 bg-white z-50 flex flex-col" },
                        createElement('div', { className: "p-6 pt-12 flex justify-between items-center border-b border-gray-50" },
                            createElement('h3', { className: "font-bold text-lg" }, "내역 추가"),
                            createElement('button', { onClick: () => setShowAddModal(false), className: "p-2 bg-gray-50 rounded-full" }, createElement(IconX))
                        ),
                        createElement('div', { className: "p-6 space-y-6 overflow-y-auto" },
                            createElement('div', { className: "flex bg-[#F2F4F6] p-1.5 rounded-2xl" },
                                createElement('button', { onClick: () => {setFormType('withdraw');}, className: `flex-1 py-3 rounded-xl text-sm font-bold transition ${formType === 'withdraw' ? 'bg-white shadow-sm text-[#3182F6]' : 'text-[#8B95A1]'}` }, "출금 (-)"),
                                createElement('button', { onClick: () => {setFormType('deposit');}, className: `flex-1 py-3 rounded-xl text-sm font-bold transition ${formType === 'deposit' ? 'bg-white shadow-sm text-[#F04452]' : 'text-[#8B95A1]'}` }, "입금 (+)")
                            ),
                            createElement('div', { className: "space-y-4" },
                                createElement('div', null, 
                                    createElement('label', { className: "text-xs font-bold text-[#8B95A1] ml-1" }, "금액"), 
                                    createElement('input', { 
                                        type: "text", 
                                        inputMode: "numeric", // 숫자 키패드 띄우기
                                        pattern: "[0-9]*",
                                        className: "w-full bg-[#F2F4F6] p-4 rounded-xl text-2xl font-black outline-none", 
                                        value: formAmount, 
                                        onChange: e => setFormAmount(e.target.value.replace(/[^0-9]/g, '')) // 숫자만 입력되게 필터링
                                    })
                                ),
                                createElement('div', null, 
                                    createElement('label', { className: "text-xs font-bold text-[#8B95A1] ml-1" }, "날짜"), 
                                    createElement('input', { type: "date", className: "w-full bg-[#F2F4F6] p-4 rounded-xl font-bold outline-none", value: formDate, onChange: e => setFormDate(e.target.value) })
                                ),
                                createElement('div', null, 
                                    createElement('label', { className: "text-xs font-bold text-[#8B95A1] ml-1" }, "메모"), 
                                    createElement('input', { type: "text", className: "w-full bg-[#F2F4F6] p-4 rounded-xl font-bold outline-none", value: formMemo, onChange: e => setFormMemo(e.target.value) })
                                )
                            ),
                            createElement('button', { 
                                onClick: () => {
                                    if(!formAmount) return alert('금액 입력!');
                                    addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'jwbank_transactions'), {
                                        child: selectedChild, type: formType, amount: Number(formAmount), category: "직접입력", date: formDate, memo: formMemo, timestamp: new Date(formDate).getTime() + (Date.now() % 86400000)
                                    }).then(() => { setShowAddModal(false); setFormAmount(''); setFormMemo(''); });
                                },
                                className: "w-full bg-[#3182F6] text-white py-5 rounded-2xl font-bold text-lg"
                            }, "저장하기")
                        )
                    )
                )
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(createElement(App));
    </script>
</body>
</html>
